<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Heart</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #heart {
        position: relative;
        width: 700px;
        height: 650px;
    }

    .love {
        position: absolute;
        color: #008cff;
        font-family: Arial, sans-serif;
        font-size: 13px;
        font-weight: bold;
        white-space: nowrap;

        text-shadow:
            0 0 4px #008cff,
            0 0 8px #006eff,
            0 0 15px #004cff;

        transform: translate(-50%, -50%);
        opacity: 0;
        transition:
            left 1.8s ease-in-out,
            top 1.8s ease-in-out,
            transform 1.8s ease-in-out,
            opacity 1s ease;
    }

    .love:nth-child(3n) {
        font-size: 11px;
        opacity: 0.8;
    }

    .love:nth-child(4n) {
        font-size: 15px;
    }

    .love:nth-child(5n) {
        font-size: 10px;
        opacity: 0.65;
    }
</style>
</head>

<body>

<div id="heart"></div>

<script>

const heart = document.getElementById("heart");

const total = 120;
const words = [];


// CREATE "I LOVE YOU" TEXT
for (let i = 0; i < total; i++) {

    const text = document.createElement("div");

    text.className = "love";
    text.textContent = "I LOVE YOU";

    heart.appendChild(text);
    words.push(text);
}


// HEART FORMULA
function heartPosition(t) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: y
    };
}


// GET HEART POSITIONS
const heartPoints = [];

for (let i = 0; i < total; i++) {

    const t = (Math.PI * 2 * i) / total;

    const point = heartPosition(t);

    heartPoints.push(point);
}


// SCALE HEART
const scale = 18;

const centerX = 350;
const centerY = 315;


// INITIAL RANDOM POSITIONS
function randomStart() {

    words.forEach((word, i) => {

        const angle = Math.random() * Math.PI * 2;

        const radius = 100 + Math.random() * 250;

        const x =
            centerX +
            Math.cos(angle) * radius;

        const y =
            centerY +
            Math.sin(angle) * radius;

        word.style.left = x + "px";
        word.style.top = y + "px";

        word.style.opacity = "0";

        word.style.transform =
            `translate(-50%, -50%) rotate(${Math.random() * 360}deg) scale(0.5)`;
    });
}


// FORM HEART
function formHeart() {

    words.forEach((word, i) => {

        const point = heartPoints[i];

        const x =
            centerX +
            point.x * scale;

        const y =
            centerY -
            point.y * scale;

        word.style.left = x + "px";
        word.style.top = y + "px";

        word.style.opacity = "1";

        word.style.transform =
            `translate(-50%, -50%) rotate(0deg) scale(1)`;
    });
}


// SCATTER AGAIN
function scatterHeart() {

    words.forEach((word, i) => {

        const angle =
            (Math.PI * 2 * i) / total;

        const distance =
            100 + Math.random() * 300;

        const x =
            centerX +
            Math.cos(angle) * distance;

        const y =
            centerY +
            Math.sin(angle) * distance;

        word.style.left = x + "px";
        word.style.top = y + "px";

        word.style.opacity = "0.2";

        word.style.transform =
            `translate(-50%, -50%) rotate(${Math.random() * 360}deg) scale(0.6)`;
    });
}


// ANIMATION LOOP
function animate() {

    // START SCATTERED
    randomStart();

    // Give browser time to show scattered text
    setTimeout(() => {

        // START APPEARING
        words.forEach((word, i) => {

            setTimeout(() => {
                word.style.opacity = "1";
            }, i * 12);

        });

    }, 300);


    // FORM HEART
    setTimeout(() => {

        formHeart();

    }, 1800);


    // HOLD HEART
    setTimeout(() => {

        // keep heart visible

    }, 4500);


    // BREAK APART
    setTimeout(() => {

        scatterHeart();

    }, 5200);


    // RESTART
    setTimeout(() => {

        animate();

    }, 7200);
}


animate();

</script>

</body>
</html>
