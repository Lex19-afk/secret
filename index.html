<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Rohlen</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #heart {
        position: relative;
        width: 800px;
        height: 700px;
    }

    .love {
        position: absolute;
        color: #008cff;
        font-family: Arial, sans-serif;
        font-size: 11px;
        font-weight: bold;
        white-space: nowrap;

        text-shadow:
            0 0 4px #008cff,
            0 0 8px #0077ff,
            0 0 14px #0055ff;

        transform: translate(-50%, -50%);
        opacity: 0;

        transition:
            left 2s ease-in-out,
            top 2s ease-in-out,
            transform 2s ease-in-out,
            opacity 1s ease;
    }

    .love:nth-child(3n) {
        font-size: 10px;
    }

    .love:nth-child(4n) {
        font-size: 13px;
    }

    .love:nth-child(5n) {
        font-size: 9px;
        opacity: 0.8;
    }
</style>
</head>

<body>

<div id="heart"></div>

<script>

const heart = document.getElementById("heart");

const total = 160;

const words = [];


// ===============================
// CREATE I LOVE YOU ROHLEN TEXT
// ===============================

for (let i = 0; i < total; i++) {

    const text = document.createElement("div");

    text.className = "love";

    text.textContent = "I LOVE YOU ROHLEN";

    heart.appendChild(text);

    words.push(text);
}


// ===============================
// HEART FORMULA
// ===============================

function heartPosition(t) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: y
    };
}


// ===============================
// CREATE HEART POSITIONS
// ===============================

const heartPoints = [];

for (let i = 0; i < total; i++) {

    const t = (Math.PI * 2 * i) / total;

    const point = heartPosition(t);

    heartPoints.push(point);
}


// ===============================
// HEART SIZE AND CENTER
// ===============================

const scale = 20;

const centerX = 400;

const centerY = 350;


// ===============================
// START RANDOM
// ===============================

function randomStart() {

    words.forEach((word, i) => {

        const angle =
            Math.random() * Math.PI * 2;

        const radius =
            80 + Math.random() * 330;

        const x =
            centerX +
            Math.cos(angle) * radius;

        const y =
            centerY +
            Math.sin(angle) * radius;

        word.style.left = x + "px";

        word.style.top = y + "px";

        word.style.opacity = "0";

        word.style.transform =
            `translate(-50%, -50%)
             rotate(${Math.random() * 360}deg)
             scale(0.5)`;
    });
}


// ===============================
// FORM THE HEART
// ===============================

function formHeart() {

    words.forEach((word, i) => {

        const point = heartPoints[i];

        const x =
            centerX +
            point.x * scale;

        const y =
            centerY -
            point.y * scale;

        word.style.left = x + "px";

        word.style.top = y + "px";

        word.style.opacity = "1";

        word.style.transform =
            `translate(-50%, -50%)
             rotate(0deg)
             scale(1)`;
    });
}


// ===============================
// SCATTER THE HEART
// ===============================

function scatterHeart() {

    words.forEach((word, i) => {

        const angle =
            (Math.PI * 2 * i) / total;

        const distance =
            100 + Math.random() * 330;

        const x =
            centerX +
            Math.cos(angle) * distance;

        const y =
            centerY +
            Math.sin(angle) * distance;

        word.style.left = x + "px";

        word.style.top = y + "px";

        word.style.opacity = "0";

        word.style.transform =
            `translate(-50%, -50%)
             rotate(${Math.random() * 360}deg)
             scale(0.5)`;
    });
}


// ===============================
// ANIMATION LOOP
// ===============================

function animate() {

    // Start scattered
    randomStart();


    // Slowly appear
    setTimeout(() => {

        words.forEach((word, i) => {

            setTimeout(() => {

                word.style.opacity = "1";

            }, i * 8);

        });

    }, 300);


    // Move together and form heart
    setTimeout(() => {

        formHeart();

    }, 1800);


    // Keep the heart on screen
    setTimeout(() => {

        // Heart stays visible

    }, 4500);


    // Break the heart apart
    setTimeout(() => {

        scatterHeart();

    }, 5200);


    // Start again
    setTimeout(() => {

        animate();

    }, 7200);
}


// ===============================
// START
// ===============================

animate();

</script>

</body>
</html>
